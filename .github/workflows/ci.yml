# ─────────────────────────────────────────────────────────────
# ci.yml — Continuous Integration
#
# Runs on every pull request targeting main, and on every push
# to main.  Two jobs run in parallel:
#   • backend-ci   .NET 10 restore → build → test + coverage
#   • frontend-ci  Node 22 npm ci → lint → build
#
# Acceptance criteria:
#   ✓ A failing test, compilation error, or lint error causes
#     the workflow to fail and should block PR merge via branch
#     protection rules.
#   ✓ Test coverage (Cobertura XML) is uploaded as a build
#     artifact on every run.
#   ✓ Both jobs run concurrently.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Backend ────────────────────────────────────────────────
  backend-ci:
    name: Backend — build & test (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onboarding_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__OnboardingDb: "Host=localhost;Port=5432;Database=onboarding_test;Username=postgres;Password=postgres"
      PERSONA_REPORT_DIR: ${{ github.workspace }}/persona-report

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        run: dotnet restore src/backend/OpenOnboarding.slnx

      - name: Build (Release)
        run: dotnet build src/backend/OpenOnboarding.slnx --no-restore -c Release

      - name: Test with coverage
        run: >
          dotnet test src/backend/OpenOnboarding.slnx
          --no-build
          -c Release
          --filter "FullyQualifiedName!~OpenOnboarding.Pact.Tests.E2E"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/**/coverage.cobertura.xml
          retention-days: 14

      - name: Upload persona execution report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-execution-report
          path: ${{ env.PERSONA_REPORT_DIR }}/persona-report.json
          retention-days: 14

  # ── Frontend ───────────────────────────────────────────────
  frontend-ci:
    name: Frontend — lint & build (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Pact — consumer ────────────────────────────────────────
  pact-consumer:
    name: Pact — consumer contracts (Frontend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Generate Pact consumer contracts
        run: npm run test:pact
      - name: Upload pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: src/frontend/pacts/
          retention-days: 7

  # ── Pact — provider ────────────────────────────────────────
  pact-provider:
    name: Pact — provider verification (Backend)
    runs-on: ubuntu-latest
    needs: [pact-consumer, backend-ci]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onboarding_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__OnboardingDb: "Host=localhost;Port=5432;Database=onboarding_test;Username=postgres;Password=postgres"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Download pact contracts
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: src/frontend/pacts/
      - run: dotnet restore src/backend/OpenOnboarding.slnx
      - run: dotnet build src/backend/OpenOnboarding.slnx --no-restore -c Release
      - name: Verify provider against consumer pacts (open-onboarding)
        run: >
          dotnet test src/backend/OpenOnboarding.Pact.Tests/OpenOnboarding.Pact.Tests.csproj
          --no-build -c Release
          --filter "FullyQualifiedName~OpenOnboarding.Pact.Tests.Providers"
      - name: Verify provider against external provider (if configured)
        if: ${{ vars.PACT_PROVIDER_URL != '' }}
        env:
          PACT_PROVIDER_URL: ${{ vars.PACT_PROVIDER_URL }}
        run: >
          dotnet test src/backend/OpenOnboarding.Pact.Tests/OpenOnboarding.Pact.Tests.csproj
          --no-build -c Release
          --filter "FullyQualifiedName~OpenOnboarding.Pact.Tests.Providers"

  # ── Container image security scan ─────────────────────────
  container-scan:
    name: Container — Trivy vulnerability scan
    runs-on: ubuntu-latest
    # Run after backend passes so we have a meaningful image to scan
    needs: [backend-ci]

    permissions:
      contents: read
      security-events: write  # required to upload SARIF to GitHub Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t open-onboarding-api:scan .

      - name: Run Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "open-onboarding-api:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # report but don't fail (SARIF uploaded for visibility)

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container"

      - name: Run Trivy scan (table summary — fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "open-onboarding-api:scan"
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"  # fail the job on any CRITICAL CVE

  # ── End-to-end verification ─────────────────────────────────
  e2e-verification:
    name: E2E — UI/API/Webhook verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onboarding_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__OnboardingDb: "Host=localhost;Port=5432;Database=onboarding_test;Username=postgres;Password=postgres"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore backend dependencies
        run: dotnet restore src/backend/OpenOnboarding.slnx
      - name: Build backend test binaries
        run: dotnet build src/backend/OpenOnboarding.slnx --no-restore -c Release
      - name: Stage — UI/API journey + webhook signature
        run: >
          dotnet test src/backend/OpenOnboarding.Pact.Tests/OpenOnboarding.Pact.Tests.csproj
          --no-build -c Release
          --filter "FullyQualifiedName=OpenOnboarding.Pact.Tests.E2E.WorkflowE2ETests.Journey_ProgressesToCompletion_AndValidatesWebhookSignature"
          --logger "trx;LogFileName=e2e-ui-api-signature.trx"
      - name: Stage — integration callback retry + delivery logs
        run: >
          dotnet test src/backend/OpenOnboarding.Pact.Tests/OpenOnboarding.Pact.Tests.csproj
          --no-build -c Release
          --filter "FullyQualifiedName=OpenOnboarding.Pact.Tests.E2E.WorkflowE2ETests.Journey_RetriesWebhookFailures_AndPersistsDeliveryLog"
          --logger "trx;LogFileName=e2e-webhook-retry.trx"
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-verification-results
          path: |
            src/backend/OpenOnboarding.Pact.Tests/TestResults/**/*.trx
          retention-days: 14

  # ── Playwright browser + API journey tests ──────────────────
  playwright-e2e:
    name: Playwright — Browser & Journey API Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: onboarding_playwright
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__OnboardingDb: "Host=localhost;Port=5432;Database=onboarding_playwright;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5072
      Authentication__ApiKey: playwright-api-key
      Authentication__JwtAuthority: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend
        run: dotnet restore src/backend/OpenOnboarding.slnx

      - name: Build backend
        run: dotnet build src/backend/OpenOnboarding.slnx --no-restore -c Release

      - name: Install dotnet tools
        run: dotnet tool restore

      - name: Apply database migrations
        run: dotnet ef database update --project src/backend/OpenOnboarding.Infrastructure --startup-project src/backend/OpenOnboarding.Api --no-build

      - name: Start API in background
        run: |
          dotnet run --project src/backend/OpenOnboarding.Api --no-build -c Release &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5072/health > /dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... attempt $i"
            sleep 2
          done
          echo "API did not start in time" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: src/frontend
        env:
          PLAYWRIGHT_API_BASE_URL: http://localhost:5072
          PLAYWRIGHT_API_KEY: playwright-api-key
          VITE_API_BASE_URL: http://localhost:5072
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 14
