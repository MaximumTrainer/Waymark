# ─────────────────────────────────────────────────────────────
# create-backlog-issues.yml
#
# Reads every *.md file (except README.md) under docs/issues/,
# parses the YAML front-matter for title and labels, and creates
# a GitHub issue for each one.
#
# Triggers:
#   • Manual (workflow_dispatch) — run from the Actions tab.
#   • Automatically when a new issue-markdown file is pushed to
#     main (path filter: docs/issues/*.md).
#
# Features:
#   • Duplicate detection — skips any issue whose title already
#     exists (open or closed) to make the workflow idempotent.
#   • Dry-run mode — set the dry_run input to true to preview
#     what would be created without touching the issue tracker.
#   • Auto label creation — labels referenced in the markdown
#     front-matter are created in the repository if they do not
#     already exist.
# ─────────────────────────────────────────────────────────────
name: Create Backlog Issues

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print what would be created without creating anything"
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - "docs/issues/[0-9]*.md"

permissions:
  issues: write
  contents: read

jobs:
  create-issues:
    name: Create GitHub issues from docs/issues/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse and create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          ISSUES_DIR="docs/issues"

          # ── Ensure a label exists; create it (grey) if absent ────────────
          ensure_label() {
            local label="$1"
            local existing
            existing=$(gh label list \
              --repo "$REPO" \
              --search "$label" \
              --json name \
              --jq '.[].name' \
              | grep -Fx "$label" || true)

            if [[ -z "$existing" ]]; then
              echo "  → Creating label: $label"
              gh label create "$label" \
                --repo "$REPO" \
                --color "ededed" \
                --description "" \
                --force 2>/dev/null || true
            fi
          }

          # ── Process one markdown file ─────────────────────────────────────
          process_file() {
            local file="$1"

            # ── Extract title from YAML front-matter ──────────────────────
            local title
            title=$(grep -m1 '^title:' "$file" \
              | sed 's/^title:[[:space:]]*"\(.*\)"/\1/' \
              | xargs)

            if [[ -z "$title" ]]; then
              echo "⏭  Skipping $(basename "$file") — no title in front-matter"
              return
            fi

            # ── Extract labels array from front-matter ────────────────────
            local labels_raw
            labels_raw=$(grep -m1 '^labels:' "$file" \
              | sed 's/^labels:[[:space:]]*\[//' \
              | sed 's/\]//' \
              | tr -d '"')

            # ── Extract body (everything after the second ---) ─────────────
            local body
            body=$(awk '/^---$/{if(++c==2){found=1; next}} found{print}' "$file")

            # ── Duplicate detection ───────────────────────────────────────
            local existing_title
            existing_title=$(gh issue list \
              --repo "$REPO" \
              --search "\"$title\" in:title" \
              --state all \
              --limit 100 \
              --json title \
              --jq '.[].title' \
              | grep -Fx "$title" || true)

            if [[ -n "$existing_title" ]]; then
              echo "⏭  Already exists: $title"
              return
            fi

            # ── Dry-run path ──────────────────────────────────────────────
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "🔍 [dry-run] Would create: $title"
              echo "   Labels : $labels_raw"
              return
            fi

            # ── Build --label flags array ─────────────────────────────────
            local -a label_args=()
            if [[ -n "$labels_raw" ]]; then
              IFS=',' read -ra raw_labels <<< "$labels_raw"
              for lbl in "${raw_labels[@]}"; do
                lbl=$(echo "$lbl" | xargs)   # trim surrounding whitespace
                [[ -z "$lbl" ]] && continue
                ensure_label "$lbl"
                label_args+=(--label "$lbl")
              done
            fi

            # ── Create the issue ──────────────────────────────────────────
            echo "✅ Creating: $title"
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body "$body" \
              "${label_args[@]}"
          }

          # ── Iterate over numbered issue files ─────────────────────────────
          shopt -s nullglob
          files=("$ISSUES_DIR"/[0-9]*.md)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No issue files found in $ISSUES_DIR — nothing to do."
            exit 0
          fi

          for f in "${files[@]}"; do
            process_file "$f"
          done

          echo ""
          echo "Done. Visit https://github.com/$REPO/issues"
