name: Feature Gaps → GitHub Issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-feature-gap-issues:
    name: Create issues from feature-gaps.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or skip feature gap issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const filePath = 'feature-gaps.md';
            if (!fs.existsSync(filePath)) {
              core.setFailed(`Missing required file: ${filePath}`);
              return;
            }

            const markdown = fs.readFileSync(filePath, 'utf8');
            const lines = markdown.split(/\r?\n/);
            const gapHeadingPrefix = '## Gap ';

            const gaps = [];
            let currentGap = null;

            for (const line of lines) {
              if (line.startsWith(gapHeadingPrefix)) {
                if (currentGap) gaps.push(currentGap);
                currentGap = {
                  heading: line.replace(/^##\s*/, '').trim(),
                  contentLines: []
                };
                continue;
              }

              if (currentGap) {
                currentGap.contentLines.push(line);
              }
            }

            if (currentGap) gaps.push(currentGap);

            if (gaps.length === 0) {
              core.setFailed(`No gap sections found in ${filePath}.`);
              return;
            }

            const candidateIssues = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              {
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "Feature Gap:"`,
                per_page: 100
              }
            );

            const issuesByTitle = new Map();
            for (const item of candidateIssues) {
              if (item.pull_request) continue;
              if (!issuesByTitle.has(item.title)) {
                issuesByTitle.set(item.title, []);
              }
              issuesByTitle.get(item.title).push(item);
            }

            for (const gap of gaps) {
              const issueTitle = `Feature Gap: ${gap.heading}`;
              const exactMatches = issuesByTitle.get(issueTitle) ?? [];

              const openMatch = exactMatches.find((item) => item.state === 'open');
              if (openMatch) {
                core.info(`Skipping existing open issue: ${issueTitle}`);
                continue;
              }

              const sectionBody = gap.contentLines.join('\n').trim();
              const issueBody = [
                `Source: \`${filePath}\``,
                '',
                sectionBody
              ].join('\n');

              const closedMatch = exactMatches.find((item) => item.state === 'closed');
              if (closedMatch) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: closedMatch.number,
                  state: 'open'
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: closedMatch.number,
                  body: [
                    'Reopened because this gap still exists in `feature-gaps.md`.',
                    '',
                    'Latest gap details:',
                    '',
                    issueBody
                  ].join('\n')
                });

                core.info(`Reopened issue: ${issueTitle}`);
                continue;
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody
              });

              core.info(`Created issue: ${issueTitle}`);
            }
